services:
  phishguard:
    build: .
    image: phishguard:0.9.0
    container_name: phishguard
    ports:
      # Local-only by default; set PHISHGUARD_BIND_ADDRESS=0.0.0.0 only if you
      # intentionally want other devices on your network to reach the app.
      - "${PHISHGUARD_BIND_ADDRESS:-127.0.0.1}:${PHISHGUARD_PORT:-8000}:8000"
    environment:
      # Optional reputation keys; URL sharing still requires per-scan consent.
      GSB_API_KEY: ${GSB_API_KEY:-}
      VT_API_KEY: ${VT_API_KEY:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      PHISHTANK_APP_KEY: ${PHISHTANK_APP_KEY:-}
      # Optional Mailjet API delivery; credentials remain server-side.
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
      MAILJET_FROM_EMAIL: ${MAILJET_FROM_EMAIL:-}
      MAILJET_FROM_NAME: ${MAILJET_FROM_NAME:-PhishGuard}
      # Optional Web Push VAPID and scheduled digest settings.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      CRON_SECRET: ${CRON_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      # SQLite is persistent in the named phishguard-data volume below.
      PHISHGUARD_DATA_DIR: /app/data
      PHISHGUARD_DB: /app/data/phishguard.db
      PORT: 8000
    init: true
    volumes:
      # Persists baselines, vendor bank records, clusters and receipts.
      - phishguard-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  phishguard-data:
